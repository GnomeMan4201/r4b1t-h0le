name: deploy r4b1t worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-r4b1t-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Stage site under /r4b1t-h0le/ path
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t-h0le/

      - name: Run complete test suite
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: npm test

      - name: Verify no tracked deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .dev.vars
          test ! -e .env
          test ! -e .env.local
          if git grep -nE -- 'CLOUDFLARE_API_TOKEN=|CLOUDFLARE_ACCOUNT_ID=|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!.github/workflows/deploy-worker.yml'; then
            echo 'Potential deployment secret material found in tracked source.' >&2
            exit 1
          fi

      - name: Deploy versioned Worker
        run: npx --yes wrangler@4.125.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production trust boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://r4b1t-proxy.badbanana6969.workers.dev'
          allowed='https://gnomeman4201.github.io'

          probe_status() {
            local name="$1"
            local expected="$2"
            local method="$3"
            local origin="$4"
            local path="$5"
            local body_file="${6:-/dev/null}"
            local status=''

            for attempt in 1 2 3 4 5 6; do
              if [ "$method" = 'HEAD' ]; then
                status=$(curl --silent --show-error --head --output "$body_file" --write-out '%{http_code}' \
                  -H "Origin: $origin" "$base$path" || true)
              else
                status=$(curl --silent --show-error --request "$method" --output "$body_file" --write-out '%{http_code}' \
                  -H "Origin: $origin" "$base$path" || true)
              fi

              echo "$name attempt $attempt: HTTP $status (expected $expected)"
              if [ "$status" = "$expected" ]; then
                return 0
              fi
              sleep 5
            done

            echo "$name failed after retries: got HTTP $status, expected $expected" >&2
            return 1
          }

          probe_status 'pages OG' 200 GET "$allowed" '/og?url=https%3A%2F%2Fexample.com' /tmp/og.json
          grep -q '"title"' /tmp/og.json

          probe_status 'custom-domain OG' 200 GET 'https://r4b1t.badbananaresearch.com' '/og?url=https%3A%2F%2Fexample.com'
          probe_status 'HEAD OG' 200 HEAD "$allowed" '/og?url=https%3A%2F%2Fexample.com'
          probe_status 'unknown Origin' 403 GET 'https://evil.example' '/og?url=https%3A%2F%2Fexample.com'
          probe_status 'loopback block' 403 GET "$allowed" '/proxy?url=http%3A%2F%2F127.0.0.1%2F'
          probe_status 'scheme block' 400 GET "$allowed" '/proxy?url=file%3A%2F%2F%2Fetc%2Fpasswd'
          probe_status 'legacy API removed' 410 GET "$allowed" '/api'

          headers=$(curl --silent --show-error --dump-header - --output /dev/null \
            -H "Origin: $allowed" \
            "$base/og?url=https%3A%2F%2Fexample.com")
          grep -qi '^x-content-type-options:[[:space:]]*nosniff' <<< "$headers"
          grep -qi '^referrer-policy:[[:space:]]*no-referrer' <<< "$headers"

          echo 'Production trust-boundary verification passed.'
