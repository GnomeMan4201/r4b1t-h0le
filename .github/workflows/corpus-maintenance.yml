name: Daily Corpus Maintenance

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/maintain_corpus.py'
      - 'tests/test_maintain_corpus.py'
      - '.github/workflows/corpus-maintenance.yml'
      - 'requirements-pool-sweep.txt'
  pull_request:
    paths:
      - 'tools/maintain_corpus.py'
      - 'tests/test_maintain_corpus.py'
      - '.github/workflows/corpus-maintenance.yml'
      - 'requirements-pool-sweep.txt'

permissions:
  contents: read

concurrency:
  group: daily-corpus-maintenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-pool-sweep.txt
      - run: python -m unittest discover -s tests -p 'test_maintain_corpus.py' -v

  daily-evidence:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: daily-corpus-maintenance-evidence
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-pool-sweep.txt
      - name: Restore prior history from the dedicated evidence branch
        run: |
          set -euo pipefail
          branch=automation/corpus-maintenance
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          echo "MAINTENANCE_PREVIOUS_SHA=$remote_sha" >> "$GITHUB_ENV"
          if [ -n "$remote_sha" ]; then
            git fetch origin "$remote_sha"
            git show "$remote_sha:corpus/maintenance/state.json" > /tmp/corpus-maintenance-state.json
          elif [ -f corpus/maintenance/state.json ]; then
            cp corpus/maintenance/state.json /tmp/corpus-maintenance-state.json
          fi
      - name: Collect approved indexes and check due active URLs
        run: python tools/maintain_corpus.py --state /tmp/corpus-maintenance-state.json
      - name: Publish daily summary
        run: cat corpus/maintenance/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-corpus-evidence-${{ github.run_id }}
          path: corpus/maintenance/
          retention-days: 30
      - name: Update one rolling evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=automation/corpus-maintenance
          git switch -C "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- corpus/maintenance/state.json corpus/maintenance/proposals.json corpus/maintenance/report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record daily corpus discovery and health evidence'
          git push --force-with-lease="refs/heads/$branch:$MAINTENANCE_PREVIOUS_SHA" origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --state open --base main --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title 'Daily corpus discoveries and retirement evidence' --body-file corpus/maintenance/report.md
          else
            gh pr create --base main --head "$branch" --title 'Daily corpus discoveries and retirement evidence' --body-file corpus/maintenance/report.md
          fi
