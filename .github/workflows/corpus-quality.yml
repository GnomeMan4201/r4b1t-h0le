name: Corpus Quality

on:
  pull_request:
    paths:
      - 'urls.txt'
      - 'tools/corpus_health.py'
      - 'tools/compile_eligibility.py'
      - 'tools/profile_eligibility.py'
      - 'tools/corpus_provenance.py'
      - 'tools/source_catalog.py'
      - 'tools/aggregate_provenance.py'
      - 'tools/build_corpus_release.py'
      - 'tools/terrain_index.py'
      - 'tools/reexecute_trail.py'
      - 'tests/test_terrain_index.py'
      - 'tests/test_reexecute_trail.py'
      - 'tools/site_key_v1.py'
      - 'tools/selection_v3.py'
      - 'tools/selection_v3_metrics.py'
      - 'tests/test_selection_v3.py'
      - 'selection/site-key-v1/**'
      - 'site-key-v1.js'
      - 'selection-v3.js'
      - 'SELECTION_TRANSACTION_V3.md'
      - 'tests/site-key-v1.test.js'
      - 'tests/selection-v3.test.js'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'corpus/terrains/**'
      - 'corpus/runtime/eligibility-profiles-v1.json'
      - 'TERRAIN_AUTHORITY_CONTRACT.md'
      - 'tests/test_corpus_health.py'
      - 'tests/test_compile_eligibility.py'
      - 'tests/test_profile_eligibility.py'
      - 'tests/test_corpus_provenance.py'
      - 'tests/test_source_catalog.py'
      - 'tests/test_aggregate_provenance.py'
      - 'tests/test_build_corpus_release.py'
      - 'schemas/eligibility-input-v1.schema.json'
      - 'schemas/eligibility-output-v1.schema.json'
      - 'schemas/corpus-provenance-v1.schema.json'
      - 'schemas/source-catalog-v1.schema.json'
      - 'schemas/corpus-release-v1.schema.json'
      - 'ELIGIBILITY_CONTRACT.md'
      - 'CORPUS_PROVENANCE_CONTRACT.md'
      - 'SOURCE_CATALOG_CONTRACT.md'
      - 'PROVENANCE_AGGREGATION_CONTRACT.md'
      - 'CORPUS_RELEASE_CONTRACT.md'
      - 'docs/CORPUS_GOVERNANCE.md'
      - 'corpus/sources/**'
      - 'corpus/catalogs/**'
      - 'corpus/releases/**'
      - '.github/corpus-policy.json'
      - '.github/corpus-policy.example.json'
      - '.github/workflows/corpus-quality.yml'
  push:
    branches: [main]
    paths:
      - 'urls.txt'
      - 'tools/corpus_health.py'
      - 'tools/compile_eligibility.py'
      - 'tools/profile_eligibility.py'
      - 'tools/corpus_provenance.py'
      - 'tools/source_catalog.py'
      - 'tools/aggregate_provenance.py'
      - 'tools/build_corpus_release.py'
      - 'tools/terrain_index.py'
      - 'tools/reexecute_trail.py'
      - 'tests/test_terrain_index.py'
      - 'tests/test_reexecute_trail.py'
      - 'tools/site_key_v1.py'
      - 'tools/selection_v3.py'
      - 'tools/selection_v3_metrics.py'
      - 'tests/test_selection_v3.py'
      - 'selection/site-key-v1/**'
      - 'site-key-v1.js'
      - 'selection-v3.js'
      - 'SELECTION_TRANSACTION_V3.md'
      - 'tests/site-key-v1.test.js'
      - 'tests/selection-v3.test.js'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'trail-v03.js'
      - 'corpus/terrains/**'
      - 'corpus/runtime/eligibility-profiles-v1.json'
      - 'TERRAIN_AUTHORITY_CONTRACT.md'
      - 'tests/test_corpus_health.py'
      - 'tests/test_compile_eligibility.py'
      - 'tests/test_profile_eligibility.py'
      - 'tests/test_corpus_provenance.py'
      - 'tests/test_source_catalog.py'
      - 'tests/test_aggregate_provenance.py'
      - 'tests/test_build_corpus_release.py'
      - 'schemas/eligibility-input-v1.schema.json'
      - 'schemas/eligibility-output-v1.schema.json'
      - 'schemas/corpus-provenance-v1.schema.json'
      - 'schemas/source-catalog-v1.schema.json'
      - 'schemas/corpus-release-v1.schema.json'
      - 'ELIGIBILITY_CONTRACT.md'
      - 'CORPUS_PROVENANCE_CONTRACT.md'
      - 'SOURCE_CATALOG_CONTRACT.md'
      - 'PROVENANCE_AGGREGATION_CONTRACT.md'
      - 'CORPUS_RELEASE_CONTRACT.md'
      - 'docs/CORPUS_GOVERNANCE.md'
      - 'corpus/sources/**'
      - 'corpus/catalogs/**'
      - 'corpus/releases/**'
      - '.github/corpus-policy.json'
      - '.github/corpus-policy.example.json'
      - '.github/workflows/corpus-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Syntax check
        run: >-
          python -m compileall -q
          tools/corpus_health.py
          tools/compile_eligibility.py
          tools/profile_eligibility.py
          tools/corpus_provenance.py
          tools/source_catalog.py
          tools/aggregate_provenance.py
          tools/build_corpus_release.py
          tools/terrain_index.py
          tools/reexecute_trail.py
          tools/site_key_v1.py
          tools/selection_v3.py
          tools/selection_v3_metrics.py
          tests/test_corpus_health.py
          tests/test_compile_eligibility.py
          tests/test_profile_eligibility.py
          tests/test_corpus_provenance.py
          tests/test_source_catalog.py
          tests/test_aggregate_provenance.py
          tests/test_build_corpus_release.py
          tests/test_terrain_index.py
          tests/test_reexecute_trail.py
          tests/test_selection_v3.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_corpus_health.py' -v
          python -m unittest discover -s tests -p 'test_compile_eligibility.py' -v
          python -m unittest discover -s tests -p 'test_profile_eligibility.py' -v
          python -m unittest discover -s tests -p 'test_corpus_provenance.py' -v
          python -m unittest discover -s tests -p 'test_source_catalog.py' -v
          python -m unittest discover -s tests -p 'test_aggregate_provenance.py' -v
          python -m unittest discover -s tests -p 'test_build_corpus_release.py' -v
          python -m unittest discover -s tests -p 'test_terrain_index.py' -v
          python -m unittest discover -s tests -p 'test_reexecute_trail.py' -v
          python -m unittest discover -s tests -p 'test_selection_v3.py' -v

      - name: Compile pinned source catalogs
        run: |
          mkdir -p catalog-build
          for manifest in corpus/catalogs/*.json; do
            if [[ ! -e "$manifest" ]]; then
              continue
            fi
            name="$(basename "$manifest" .json)"
            python tools/source_catalog.py \
              --manifest "$manifest" \
              --root . \
              --out-dir "catalog-build/$name"
          done

      - name: Aggregate typed catalog provenance
        run: |
          python tools/aggregate_provenance.py \
            --input catalog-build/*/provenance.json \
            --out-dir typed-corpus-build

      - name: Compile typed eligibility pool
        run: |
          python tools/compile_eligibility.py \
            --input typed-corpus-build/eligibility-input.json \
            --out-dir typed-corpus-build/eligibility

      - name: Build typed candidate release
        run: |
          python tools/build_corpus_release.py \
            --aggregate-dir typed-corpus-build \
            --eligibility-dir typed-corpus-build/eligibility \
            --release-id typed-candidate-v0.1 \
            --out-dir typed-corpus-build/release

      - name: Verify checked-in typed candidate release
        run: |
          if [[ -d corpus/releases/typed-candidate-v0.1 ]]; then
            diff -ru corpus/releases/typed-candidate-v0.1 typed-corpus-build/release
          fi

      - name: Verify checked-in terrain index regenerates from the release
        run: |
          python - <<'PY'
          import json, subprocess, sys
          registry = json.load(open('corpus/runtime/eligibility-profiles-v1.json', encoding='utf-8'))
          for profile in registry['profiles']:
              release = 'corpus/releases/' + profile['release']['release_id']
              print(profile['profile_id'], '->', profile['terrain_index']['path'])
              subprocess.run([sys.executable, 'tools/terrain_index.py', 'check',
                              '--release', release, '--index', profile['terrain_index']['path']], check=True)
          PY

      - name: Generate and enforce deterministic corpus evidence
        run: |
          python tools/corpus_health.py \
            --input urls.txt \
            --json corpus-health.json \
            --markdown corpus-health.md \
            --policy .github/corpus-policy.json \
            --enforce

      - name: Generate eligibility-v1 corpus audit
        run: |
          python tools/profile_eligibility.py \
            --input urls.txt \
            --json eligibility-profile.json \
            --markdown eligibility-profile.md \
            --sample-limit 8

      - name: Verify evidence outputs
        run: |
          test -s corpus-health.json
          test -s corpus-health.md
          test -s eligibility-profile.json
          test -s eligibility-profile.md
          if compgen -G 'corpus/catalogs/*.json' > /dev/null; then
            test -n "$(find catalog-build -name provenance.json -print -quit)"
            test -n "$(find catalog-build -name untyped.json -print -quit)"
            test -s typed-corpus-build/provenance.json
            test -s typed-corpus-build/compiled.json
            test -s typed-corpus-build/eligibility-input.json
            test -s typed-corpus-build/summary.json
            test -s typed-corpus-build/eligibility/eligible.json
            test -s typed-corpus-build/eligibility/excluded.json
            test -s typed-corpus-build/eligibility/manifest.json
            test -s typed-corpus-build/release/urls.txt
            test -s typed-corpus-build/release/resources.json
            test -s typed-corpus-build/release/manifest.json
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f corpus-health.md ]]; then
            cat corpus-health.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f eligibility-profile.md ]]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat eligibility-profile.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-evidence-${{ github.sha }}
          path: |
            corpus-health.json
            corpus-health.md
            eligibility-profile.json
            eligibility-profile.md
            catalog-build/
            typed-corpus-build/
          if-no-files-found: warn
          retention-days: 30
