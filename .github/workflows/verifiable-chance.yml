name: Verifiable Chance Experiment

on:
  pull_request:
    paths:
      - 'experiments/verifiable-chance/**'
      - 'tests/verifiable-chance.test.js'
      - 'tests/test_verifiable_chance.py'
      - 'package.json'
      - '.github/workflows/verifiable-chance.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/verifiable-chance/**'
      - 'tests/verifiable-chance.test.js'
      - 'tests/test_verifiable_chance.py'
      - 'package.json'
      - '.github/workflows/verifiable-chance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifiable-chance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install experiment-only BLS dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input py_ecc==8.0.0
          python -m pip check

      - name: Syntax check
        run: |
          node --check experiments/verifiable-chance/public-roll.mjs
          python -m compileall -q experiments/verifiable-chance/verify_public_roll.py tests/test_verifiable_chance.py

      - name: Independent JavaScript derivation tests
        run: node --test tests/verifiable-chance.test.js

      - name: Offline Quicknet BLS and cross-language receipt tests
        run: python -m unittest discover -s tests -p 'test_verifiable_chance.py' -v
