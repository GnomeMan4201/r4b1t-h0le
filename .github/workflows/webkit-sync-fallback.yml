name: WebKit Synchronous Fallback Decision

on:
  pull_request:
    paths:
      - '.github/workflows/webkit-sync-fallback.yml'
      - 'tests/roll-reel-fallback-now.spec.js'
      - 'playwright.reel-webkit-fallback-now.config.js'
      - 'dual-shell.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rabbit-sync-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  synchronous-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Stage site
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='test-site' --exclude='playwright-report' --exclude='test-results' ./ test-site/r4b1t-h0le/
      - name: Twenty first-ROLL runs invoking fallback synchronously
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        shell: bash
        run: |
          set +e
          npx playwright test --config=playwright.reel-webkit-fallback-now.config.js --project=mobile-webkit --repeat-each=20 --workers=4 --reporter=json > sync-fallback.json
          test_exit=$?
          set -e
          node - <<'NODE'
          const report=require('./sync-fallback.json');
          const trials=[];
          const scan=groups=>{
            for(const group of groups||[]){
              for(const s of group.specs||[])for(const t of s.tests||[]){
                trials.push({index:trials.length+1,failed:t.status!=='expected',
                  errors:(t.results||[]).flatMap(x=>x.error?.message?[x.error.message.slice(0,2000)]:[])});
              }
              scan(group.suites);
            }
          };
          scan(report.suites);
          const failures=trials.filter(t=>t.failed);
          const control=process.env.GITHUB_HEAD_REF.includes('synchronous-fallback-control');
          const expected=control?20:0;
          const targetSpecific=control ? failures.every(t=>t.errors.some(e=>
            e.includes('SYNC_FALLBACK_LIFECYCLE') && e.includes('"starts":0')
            && e.includes('"rollingAfter":false'))) : true;
          const meetsGate=trials.length===20&&failures.length===expected&&targetSpecific;
          console.log(JSON.stringify({condition:process.env.GITHUB_HEAD_REF,trials:trials.length,
            firstRollFailures:failures.length,expectedFailures:expected,
            targetSpecific,meetsGate,failedTrials:failures},null,2));
          if(!meetsGate)process.exitCode=1;
          NODE
          if [[ "$test_exit" -ne 0 && ! "${GITHUB_HEAD_REF}" =~ synchronous-fallback-control ]]; then exit "$test_exit"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rabbit-sync-${{ github.sha }}
          path: |
            sync-fallback.json
            test-results/
          retention-days: 14
          if-no-files-found: warn
