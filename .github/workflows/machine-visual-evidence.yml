name: Machine Opt-In Visual Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/machine-visual-evidence.yml'
      - 'experiments/the-machine/**'
      - 'index.html'
      - 'tests/dual-shell.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-visual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 306
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Stage exact-head production assets
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='test-site' --exclude='machine-visual-evidence' ./ test-site/r4b1t-h0le/
      - name: Capture real-shell default and opt-in screenshots (non-iOS)
        run: |
          set -euo pipefail
          TEST_ROOT=test-site node tests/test-server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:8080/r4b1t-h0le/ node experiments/the-machine/capture-real-shell.mjs
      - name: Upload visual evidence (screenshots and geometry)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: machine-visual-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: machine-visual-evidence/
          if-no-files-found: warn
          retention-days: 14
