name: PR 274 Phone Preview

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-274-phone-preview
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 274
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source

      - name: Check out published Pages branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Publish isolated PR 274 preview path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages/pr-274
          mkdir -p pages/pr-274
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='preview' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            source/ pages/pr-274/
          printf '%s\n' "PR #274 phone preview — commit $GITHUB_SHA" > pages/pr-274/PREVIEW_BUILD.txt
          cd pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pr-274
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "preview: publish PR 274 at /pr-274/"
          git push origin HEAD:gh-pages


  reel-rabbit-repeat:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 274
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Stage site under /r4b1t-h0le/ path
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t-h0le/

      - name: Repeat rabbit and authority acceptance ten times
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: >
          npx playwright test tests/roll-reel.spec.js
          --project=mobile-chromium
          --grep "rabbit lifecycle completes|REEL lands on the exact authoritative result and slam does not re-pick"
          --repeat-each=10

      - name: Repeat WebKit rabbit and authority acceptance ten times
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: >
          npx playwright test --config=playwright.reel-webkit.config.js
          --grep "10 normal + 10 slammed"
          --repeat-each=10

      - name: Run WebKit reduced-motion and viewport acceptance
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: >
          npx playwright test --config=playwright.reel-webkit.config.js
          --grep "reduced motion|layout width"
