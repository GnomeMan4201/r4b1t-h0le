name: WebKit Rabbit Visual 20x

on:
  pull_request:
    paths:
      - '.github/workflows/webkit-rabbit-visual-repeat.yml'
      - 'tests/roll-reel-webkit.spec.js'
      - 'dual-shell.js'
      - 'r4b1t-h0l3-production.svg'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-visual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  visual-20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact release head SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Stage site
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='test-site' --exclude='playwright-report' --exclude='test-results' ./ test-site/r4b1t-h0le/
      - name: Repeat computed-transform + strict event lifecycle twenty times
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        shell: bash
        run: |
          set +e
          npx playwright test --config=playwright.reel-webkit.config.js --project=mobile-webkit --grep 'canonical rabbit visibly descends' --repeat-each=20 --reporter=json > visual-repeat-results.json
          test_exit=$?
          set -e
          node - <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('visual-repeat-results.json','utf8'));
          const trials=[];
          function collect(suites) {
            for(const suite of suites||[]) {
              for(const spec of suite.specs||[])for(const t of spec.tests||[])
                trials.push({name:spec.title,status:t.status,errors:(t.results||[]).flatMap(r=>r.error?.message?[r.error.message.slice(0,1100)]:[])});
              collect(suite.suites);
            }
          }
          collect(report.suites);
          const failures=trials.filter(t=>t.status!=='expected');
          console.log(JSON.stringify({visualTrials:trials.length,failures:failures.length,failedTrials:failures},null,2));
          if(trials.length!==20||failures.length!==0)process.exitCode=1;
          NODE
          if [[ "$test_exit" -ne 0 ]]; then exit "$test_exit"; fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rabbit-visual-20-${{ github.sha }}
          path: |
            visual-repeat-results.json
            test-results/
          retention-days: 14
          if-no-files-found: warn
