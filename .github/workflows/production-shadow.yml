name: Production Shadow

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run production-shadow regression tests
        run: node --test tests/production-shadow.test.js

      - name: Verify serving-layer parity, redirects, cache headers, and boundary
        run: node tools/verify-production-shadow.mjs
