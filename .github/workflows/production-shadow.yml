name: Production Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run production-shadow regression tests
        run: node --test tests/production-shadow.test.js

      - name: Verify serving-layer parity, redirects, cache headers, and boundary
        run: node tools/verify-production-shadow.mjs
