name: WILD Intake v0.6.1

on:
  push:
    branches:
      - feat/wild-50-pilot
    paths:
      - 'tools/wild-intake-v0.6.1/**'
      - '.github/workflows/wild-intake-v061.yml'
      - 'tools/site_key_v1.py'
      - 'selection/site-key-v1/**'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'corpus/releases/experience-candidate-v0.4/**'
  pull_request:
    paths:
      - 'tools/wild-intake-v0.6.1/**'
      - '.github/workflows/wild-intake-v061.yml'
      - 'tools/site_key_v1.py'
      - 'selection/site-key-v1/**'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'corpus/releases/experience-candidate-v0.4/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned intake dependencies
        run: python -m pip install -r tools/wild-intake-v0.6.1/requirements.txt
      - name: Verify frozen script bytes
        run: |
          printf '%s  %s\n' \
            fb645cdcc0d2ce2fc0edfb62fd70750194324d754d41bcf02bcc09cb449510cd \
            tools/wild-intake-v0.6.1/wild1000.py | sha256sum -c -
      - name: Real site-key authority + baseline selftest
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py selftest \
            --r4b1t-root . \
            --release experience-candidate-v0.4 | tee /tmp/wild-selftest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wild-selftest.json'))
          assert d['release_urls'] == 7033, d
          assert d['release_site_keys'] == 733, d
          assert d['release_unkeyed'] == 0, d
          assert d['vectors_checked'] >= 25, d
          print('selftest baseline: 7033 URLs / 733 siteKeys / 0 unkeyed')
          PY
      - name: Review-integrity regressions
        run: python -m pytest -q tools/wild-intake-v0.6.1/tests/test_review_integrity.py

  pilot:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned intake dependencies
        run: python -m pip install -r tools/wild-intake-v0.6.1/requirements.txt
      - name: Re-verify frozen script bytes
        run: |
          printf '%s  %s\n' \
            fb645cdcc0d2ce2fc0edfb62fd70750194324d754d41bcf02bcc09cb449510cd \
            tools/wild-intake-v0.6.1/wild1000.py | sha256sum -c -
      - name: Initialize frozen WILD 50 campaign
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py campaign-init \
            --r4b1t-root . \
            --campaign wild-50 \
            --campaign-id wild-50-pilot-v061 \
            --release experience-candidate-v0.4 \
            --expect-sitekeys 733 \
            --classification corpus/classification/resource-classification-v2.0.json \
            --campaign-target 1000 \
            2>&1 | tee wild-50-campaign-init.log
      - name: Harvest pinned breadth leads
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py harvest \
            --r4b1t-root . \
            --campaign wild-50 \
            --leads corpus/wild/leads-v1.txt \
            2>&1 | tee wild-50-harvest.log
      - name: Verify first 50 site identities
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py verify \
            --r4b1t-root . \
            --campaign wild-50 \
            --limit 50 \
            2>&1 | tee wild-50-verify.log
      - name: Record unreviewed pilot stats
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py stats \
            --r4b1t-root . \
            --campaign wild-50 \
            2>&1 | tee wild-50-stats.log
      - name: Hash authoritative evidence
        run: |
          find wild-50 -type f -print0 | sort -z | xargs -0 sha256sum > wild-50-evidence.sha256
          sha256sum wild-50-evidence.sha256
      - name: Upload authoritative WILD 50 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wild-50-v061-evidence
          path: |
            wild-50/
            wild-50-*.log
            wild-50-evidence.sha256
          if-no-files-found: error
          retention-days: 30
