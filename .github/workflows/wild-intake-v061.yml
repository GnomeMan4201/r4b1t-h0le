name: WILD Intake v0.6.1

on:
  push:
    branches:
      - feat/wild-50-pilot
    paths:
      - 'tools/wild-intake-v0.6.1/**'
      - '.github/workflows/wild-intake-v061.yml'
      - 'tools/site_key_v1.py'
      - 'selection/site-key-v1/**'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'corpus/releases/experience-candidate-v0.4/**'
      - 'corpus/classification/resource-classification-v2.0.json'
      - 'corpus/wild/leads-v1.txt'
  pull_request:
    paths:
      - 'tools/wild-intake-v0.6.1/**'
      - '.github/workflows/wild-intake-v061.yml'
      - 'tools/site_key_v1.py'
      - 'selection/site-key-v1/**'
      - 'tests/fixtures/selection-v3-vectors.json'
      - 'corpus/releases/experience-candidate-v0.4/**'
      - 'corpus/classification/resource-classification-v2.0.json'
      - 'corpus/wild/leads-v1.txt'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen tool hash
        run: |
          echo "fb645cdcc0d2ce2fc0edfb62fd70750194324d754d41bcf02bcc09cb449510cd  tools/wild-intake-v0.6.1/wild1000.py" | sha256sum -c -
      - name: Install pinned intake dependencies
        run: python -m pip install -r tools/wild-intake-v0.6.1/requirements.txt
      - name: Compile
        run: python -m py_compile tools/wild-intake-v0.6.1/wild1000.py tools/wild-intake-v0.6.1/tests/test_wild.py
      - name: Selftest real siteKey authority and baseline
        run: |
          python tools/wild-intake-v0.6.1/wild1000.py selftest \
            --r4b1t-root "$GITHUB_WORKSPACE" \
            --release experience-candidate-v0.4 > /tmp/wild-selftest.json
          cat /tmp/wild-selftest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wild-selftest.json'))
          assert d['release_urls'] == 7033, d
          assert d['release_site_keys'] == 733, d
          assert d['release_unkeyed'] == 0, d
          assert d['vectors_checked'] > 0, d
          PY
      - name: Run WILD intake regression suite
        env:
          R4B1T_ROOT: ${{ github.workspace }}
        run: python tools/wild-intake-v0.6.1/tests/test_wild.py
