name: Corpus Ledger Shadow
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'corpus/ledger/**'
      - 'tools/cj1.py'
      - 'tools/reexecute_trail.py'
      - 'tests/*ledger*'
      - '.github/workflows/ledger-shadow.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install existing guarded transport dependencies
        run: python3 -m pip install -r requirements-pool-sweep.txt
      - name: Enforce structural replay purity
        run: python3 -m corpus.ledger.tools.check_purity
      - name: Ledger rules and independent serialization vectors
        run: |
          python3 -m unittest discover -s tests -p 'test_ledger*.py'
          node --test tests/ledger-serialization.test.js tests/ledger-shadow-boundary.test.js
          node corpus/ledger/tools/production-boundary.js
      - name: Network-isolated deterministic replay
        run: |
          python3 -m corpus.ledger.tools.reference > /tmp/ledger-reference.jsonl
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=17 python3 -m corpus.ledger.tools.replay_isolated --require-isolation < /tmp/ledger-reference.jsonl > /tmp/ledger-projection-17.json
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=29 python3 -m corpus.ledger.tools.replay_isolated --require-isolation < /tmp/ledger-reference.jsonl > /tmp/ledger-projection-29.json
          cmp /tmp/ledger-projection-17.json /tmp/ledger-projection-29.json
          cmp /tmp/ledger-projection-17.json corpus/ledger/fixtures/replay-v1-projection.json
      - name: Reproduce current-authority bootstrap and independent offline verification
        run: |
          python3 -m corpus.ledger.tools.check_baseline --out /tmp/shadow-bootstrap
          python3 -m corpus.ledger.tools.shadow verify --bundle-dir /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=17 python3 -m corpus.ledger.tools.replay_isolated --require-isolation < /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline/events.jsonl > /tmp/shadow-bootstrap-replay-17.json
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=29 python3 -m corpus.ledger.tools.replay_isolated --require-isolation < /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline/events.jsonl > /tmp/shadow-bootstrap-replay-29.json
          cmp /tmp/shadow-bootstrap-replay-17.json /tmp/shadow-bootstrap-replay-29.json
      - name: Synthetic recorded discovery and isolated offline verification
        run: |
          mkdir -p /tmp/discovery-acceptance/corpus/ledger/shadow
          cp /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline.sqlite3 /tmp/discovery-acceptance/corpus/ledger/shadow/ledger.sqlite3
          python3 - <<'PYDISCOVERY'
          from corpus.ledger.tools.shadow import write_canonical
          write_canonical('/tmp/synthetic-discovery-submissions.json',[{'url':'https://recorded.example/ci-candidate','timestamp':'2026-10-04T09:30:00.000Z','basis':'Synthetic offline acceptance declaration; no real discovery asserted','metadata':{}}])
          PYDISCOVERY
          python3 -m corpus.ledger.tools.discovery prepare --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --submissions /tmp/synthetic-discovery-submissions.json --out /tmp/discovery-acceptance/corpus/ledger/shadow/window
          python3 -m corpus.ledger.tools.shadow append --store /tmp/discovery-acceptance/corpus/ledger/shadow/ledger.sqlite3 --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --proposals /tmp/discovery-acceptance/corpus/ledger/shadow/window/proposals.json --expected-head sha256:d479964f875fd6edf9da5d7c2ace15b32174e36217420f1517ddfe9914eb4dbe --out /tmp/discovery-acceptance/corpus/ledger/shadow/after
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=17 "$(command -v python3)" -m corpus.ledger.tools.discovery verify --before /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --after /tmp/discovery-acceptance/corpus/ledger/shadow/after --window /tmp/discovery-acceptance/corpus/ledger/shadow/window > /tmp/discovery-verify-17.json
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=29 "$(command -v python3)" -m corpus.ledger.tools.discovery verify --before /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --after /tmp/discovery-acceptance/corpus/ledger/shadow/after --window /tmp/discovery-acceptance/corpus/ledger/shadow/window > /tmp/discovery-verify-29.json
          cmp /tmp/discovery-verify-17.json /tmp/discovery-verify-29.json
          cat /tmp/discovery-verify-17.json
      - name: Canonical reviewed WILD discovery and isolated offline verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/wild-acceptance/corpus/ledger/shadow
          cp /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline.sqlite3 /tmp/wild-acceptance/corpus/ledger/shadow/ledger.sqlite3

          python3 -m corpus.ledger.tools.wild_discovery prepare \
            --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline \
            --timestamp 2026-10-05T19:38:29.000Z \
            --out /tmp/wild-acceptance/corpus/ledger/shadow/window \
            > /tmp/wild-prepare.json

          python3 -m corpus.ledger.tools.shadow append \
            --store /tmp/wild-acceptance/corpus/ledger/shadow/ledger.sqlite3 \
            --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline \
            --proposals /tmp/wild-acceptance/corpus/ledger/shadow/window/proposals.json \
            --expected-head sha256:d479964f875fd6edf9da5d7c2ace15b32174e36217420f1517ddfe9914eb4dbe \
            --out /tmp/wild-acceptance/corpus/ledger/shadow/after \
            > /tmp/wild-append.json

          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=17 "$(command -v python3)" \
            -m corpus.ledger.tools.wild_discovery verify \
            --before /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline \
            --after /tmp/wild-acceptance/corpus/ledger/shadow/after \
            --window /tmp/wild-acceptance/corpus/ledger/shadow/window \
            > /tmp/wild-verify-17.json

          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=29 "$(command -v python3)" \
            -m corpus.ledger.tools.wild_discovery verify \
            --before /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline \
            --after /tmp/wild-acceptance/corpus/ledger/shadow/after \
            --window /tmp/wild-acceptance/corpus/ledger/shadow/window \
            > /tmp/wild-verify-29.json

          cmp /tmp/wild-verify-17.json /tmp/wild-verify-29.json
          python3 - <<'PYWILD'
          import json
          from pathlib import Path

          verify=json.load(open('/tmp/wild-verify-17.json'))
          assert verify['status']=='VERIFIED_SHADOW_WILD_DISCOVERY_WINDOW', verify
          assert verify['event_count']==30, verify

          projection=json.load(open('/tmp/wild-acceptance/corpus/ledger/shadow/after/projection.json'))
          wild=[
              row for row in projection['resources']
              if row.get('metadata',{}).get('provenance','').startswith('r4b1t-shadow-wild-discovery-v1:')
          ]
          assert len(wild)==30, len(wild)
          assert all(row['eligibility']=='CANDIDATE' for row in wild)
          assert all(row['availability'] is None for row in wild)
          assert all(set(row['metadata'])=={'resource_type','eligibility_reason','provenance'} for row in wild)

          window=json.load(open('/tmp/wild-acceptance/corpus/ledger/shadow/window/window.json'))
          assert len(window['records'])==30
          assert window['evidence']['artifact_sha256']=='sha256:3dd3f572897203789c93ae5e75fbd2e1f4c0b41720a72e3ebf9fcb27e1cf8a89'
          assert window['evidence']['campaign_manifest']['digest']=='sha256:f0bead660cdc1d77b44b7acf29e2405d9bbdea3fa8a64666ed28fd47e87f5a4e'
          print(json.dumps({
              'status':'CANONICAL_WILD_30_SHADOW_VERIFIED',
              'records':len(wild),
              'source_head':window['source_head'],
              'event_head':verify['event_head'],
          },sort_keys=True))
          PYWILD

          cat /tmp/wild-prepare.json
          cat /tmp/wild-verify-17.json

      - name: Synthetic archive lifecycle and offline network-isolated history verification
        run: |
          python3 -m corpus.ledger.tools.history initialize --authority-root . --out /tmp/archive-acceptance/corpus/ledger/shadow/before
          python3 - <<'PYARCHIVE'
          from corpus.ledger.tools.shadow import write_canonical
          write_canonical('/tmp/synthetic-archive-operations.json',[{'type':'ARCHIVE_RESOLVED','resource_id':'r4b1t:r:000000000000002','timestamp':'2026-10-04T08:00:00.000Z','archive_url':'https://archive.example/synthetic','basis':'Synthetic offline acceptance fixture; no real archive association is asserted'}])
          PYARCHIVE
          python3 -m corpus.ledger.tools.history archive --history /tmp/archive-acceptance/corpus/ledger/shadow/before --name synthetic-acceptance --operations /tmp/synthetic-archive-operations.json --out /tmp/archive-acceptance/corpus/ledger/shadow/after
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=17 "$(command -v python3)" -m corpus.ledger.tools.history verify --history /tmp/archive-acceptance/corpus/ledger/shadow/after > /tmp/archive-history-17.json
          sudo unshare --net env PYTHONPATH="$PWD" PYTHONHASHSEED=29 "$(command -v python3)" -m corpus.ledger.tools.history verify --history /tmp/archive-acceptance/corpus/ledger/shadow/after > /tmp/archive-history-29.json
          cmp /tmp/archive-history-17.json /tmp/archive-history-29.json
          cat /tmp/archive-history-17.json
      - name: Explicit bounded live HEAD acceptance window (shadow test chain only)
        run: |
          printf '["r4b1t:r:000000000000125","r4b1t:r:000000000000126"]\n' > /tmp/shadow-probe-resources.json
          python3 -m corpus.ledger.tools.probe collect --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --resources /tmp/shadow-probe-resources.json --samples 2 --out /tmp/shadow-bootstrap/corpus/ledger/shadow/window
          python3 -m corpus.ledger.tools.shadow append --store /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline.sqlite3 --boundary-export /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --proposals /tmp/shadow-bootstrap/corpus/ledger/shadow/window/proposals.json --expected-head sha256:d479964f875fd6edf9da5d7c2ace15b32174e36217420f1517ddfe9914eb4dbe --out /tmp/shadow-bootstrap/corpus/ledger/shadow/after
          python3 -m corpus.ledger.tools.probe verify --before /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline --after /tmp/shadow-bootstrap/corpus/ledger/shadow/after --window /tmp/shadow-bootstrap/corpus/ledger/shadow/window
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/shadow-bootstrap/corpus/ledger/shadow/window/window.json'))['observations']
          print('Live HEAD observations:',len(rows),'HTTP responses:',sum('status' in row['payload'] for row in rows),'errors:',[row['payload'].get('reason') for row in rows if 'reason' in row['payload']])
          PY
      - name: Preserve complete frozen shadow inputs and verified export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: corpus-ledger-shadow-bootstrap
          path: |
            /tmp/shadow-bootstrap/corpus/ledger/shadow/baseline
            /tmp/shadow-bootstrap/corpus/ledger/shadow/window
            /tmp/shadow-bootstrap/corpus/ledger/shadow/after
            /tmp/archive-acceptance/corpus/ledger/shadow/after
            /tmp/discovery-acceptance/corpus/ledger/shadow/window
            /tmp/discovery-acceptance/corpus/ledger/shadow/after
            /tmp/wild-acceptance/corpus/ledger/shadow/window
            /tmp/wild-acceptance/corpus/ledger/shadow/after
          if-no-files-found: error
