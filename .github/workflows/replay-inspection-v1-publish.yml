name: Publish Replay Inspection v1

on:
  push:
    branches:
      - release/replay-inspection-v1-record
    paths:
      - '.github/workflows/replay-inspection-v1-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replay-inspection-v1-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: replay-inspection-v1.0.0
      TARGET_SHA: 80b9b5e885848a3227a5d876ccb22b9166c01b00
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact accepted release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify immutable target and publish release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test -f docs/REPLAY_INSPECTION_V1_RELEASE.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Replay / Inspection v1 — production accepted"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Replay / Inspection v1 — Production Accepted" \
              --notes-file docs/REPLAY_INSPECTION_V1_RELEASE.md
          fi
