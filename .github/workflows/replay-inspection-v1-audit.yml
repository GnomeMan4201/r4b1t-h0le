name: Replay Inspection v1 Audit

on:
  pull_request:
    paths:
      - 'replay-inspection-overlay.js'
      - 'tests/replay-inspection-entry.spec.js'
      - 'tests/path-consistency.test.js'
      - 'index.html'
      - 'dual-shell.js'
      - 'dual-shell.css'
      - 'sw.js'
      - 'tools/verify-production-shadow.mjs'
      - 'replay-inspection-renderer.js'
      - 'replay-inspection-import.js'
      - 'replay-inspection.css'
      - 'tests/replay-inspection-ui.spec.js'
      - 'playwright.replay.config.js'
      - 'replay-inspection.js'
      - 'replay-inspection-delegation.js'
      - 'proof-session-bundle.js'
      - 'trail-comparison-bundle.js'
      - 'tests/replay-inspection-core.test.js'
      - 'tests/replay-inspection-delegation.test.js'
      - 'docs/REPLAY_INSPECTION_V1_SPEC.md'
      - 'docs/REPLAY_INSPECTION_V1_AUDIT.md'
      - 'docs/REPLAY_INSPECTION_V1_DELEGATION.md'
      - 'docs/REPLAY_MULTISOURCE_UI_BOUNDARY.md'
      - 'docs/REPLAY_PROOF_SESSION_BUNDLE_UI_BOUNDARY.md'
      - 'docs/REPLAY_TRAIL_COMPARISON_BUNDLE_UI_BOUNDARY.md'
      - 'package.json'
      - '.github/workflows/replay-inspection-v1-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'replay-inspection-overlay.js'
      - 'tests/replay-inspection-entry.spec.js'
      - 'tests/path-consistency.test.js'
      - 'index.html'
      - 'dual-shell.js'
      - 'dual-shell.css'
      - 'sw.js'
      - 'tools/verify-production-shadow.mjs'
      - 'replay-inspection-renderer.js'
      - 'replay-inspection-import.js'
      - 'replay-inspection.css'
      - 'tests/replay-inspection-ui.spec.js'
      - 'playwright.replay.config.js'
      - 'replay-inspection.js'
      - 'replay-inspection-delegation.js'
      - 'proof-session-bundle.js'
      - 'trail-comparison-bundle.js'
      - 'tests/replay-inspection-core.test.js'
      - 'tests/replay-inspection-delegation.test.js'
      - 'docs/REPLAY_INSPECTION_V1_SPEC.md'
      - 'docs/REPLAY_INSPECTION_V1_AUDIT.md'
      - 'docs/REPLAY_INSPECTION_V1_DELEGATION.md'
      - 'docs/REPLAY_MULTISOURCE_UI_BOUNDARY.md'
      - 'docs/REPLAY_PROOF_SESSION_BUNDLE_UI_BOUNDARY.md'
      - 'docs/REPLAY_TRAIL_COMPARISON_BUNDLE_UI_BOUNDARY.md'
      - 'package.json'
      - '.github/workflows/replay-inspection-v1-audit.yml'

permissions:
  contents: read

jobs:
  replay-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Check Replay core syntax
        run: |
          node --check replay-inspection.js
          node --check replay-inspection-delegation.js
          node --check replay-inspection-renderer.js
          node --check replay-inspection-import.js
          node --check replay-inspection-overlay.js

      - name: Run Replay and frozen-delegate regression tests
        run: node --test tests/replay-inspection-core.test.js tests/replay-inspection-delegation.test.js tests/trail-manifest.test.js tests/blind-manifest.test.js tests/trail-comparison-bundle.test.js tests/proof-session-bundle.test.js

      - name: Install Chromium for Replay browser audit
        run: npx playwright install --with-deps chromium

      - name: Run Replay desktop and phone-width browser audit
        run: npm run test:replay-ui
