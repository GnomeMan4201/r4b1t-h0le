name: One-shot path consistency repair

on:
  push:
    branches: [fix/repo-path-consistency]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/repo-path-consistency
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: RED — prove the regression test catches the stale paths
        shell: bash
        run: |
          set +e
          node --test tests/path-consistency.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected path-consistency regression test to fail before the repair." >&2
            exit 1
          fi
          echo "Regression reproduced as expected."

      - name: Apply deterministic path repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          repo_files = [
              Path('README.md'),
              Path('CONTRIBUTING.md'),
              Path('dual-shell.js'),
              Path('index.html'),
              Path('.github/ISSUE_TEMPLATE/config.yml'),
          ]

          old_repo = re.compile(r'https://github\.com/GnomeMan4201/r4b1t(?=[/?#"\'\s<]|$)')
          for path in repo_files:
              text = path.read_text()
              text = old_repo.sub('https://github.com/GnomeMan4201/r4b1t-h0le', text)
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'https://gnomeman4201.github.io/r4b1t/',
              'https://gnomeman4201.github.io/r4b1t-h0le/',
          )
          text = text.replace(
              'img.shields.io/github/license/GnomeMan4201/r4b1t?',
              'img.shields.io/github/license/GnomeMan4201/r4b1t-h0le?',
          )
          readme.write_text(text)

          redirect = Path('r4b1t.html')
          redirect.write_text(
              redirect.read_text().replace(
                  'https://gnomeman4201.github.io/r4b1t/',
                  'https://gnomeman4201.github.io/r4b1t-h0le/',
              )
          )

          contributing = Path('CONTRIBUTING.md')
          contributing.write_text(
              contributing.read_text().replace('`/r4b1t/`', '`/r4b1t-h0le/`')
          )

          index = Path('index.html')
          index.write_text(
              index.read_text().replace(
                  'navigator.serviceWorker.register("/r4b1t/sw.js")',
                  'navigator.serviceWorker.register("./sw.js")',
              )
          )

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['start_url'] = './'
          manifest['scope'] = './'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace(
              "const CACHE = 'r4b1t-v16-motion-token-precache';",
              "const CACHE = 'r4b1t-v17-path-consistency';",
          )
          text = text.replace("'/r4b1t/", "'./")
          sw.write_text(text)

          workflow = Path('.github/workflows/test.yml')
          text = workflow.read_text()
          text = text.replace('/r4b1t/ path', '/r4b1t-h0le/ path')
          text = text.replace('test-site/r4b1t', 'test-site/r4b1t-h0le')
          text = text.replace(
              'http://127.0.0.1:8080/r4b1t/',
              'http://127.0.0.1:8080/r4b1t-h0le/',
          )
          workflow.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          unit = package['scripts']['test:unit']
          guard = 'tests/path-consistency.test.js'
          if guard not in unit:
              package['scripts']['test:unit'] = unit + ' ' + guard
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: GREEN — path regression test passes
        run: node --test tests/path-consistency.test.js

      - name: Run full unit suite
        run: npm run test:unit

      - name: Install Chromium for browser suite
        run: npx playwright install --with-deps chromium

      - name: Stage site at current Pages path
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t-h0le/

      - name: Run existing browser suite
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: npm test

      - name: Commit repaired paths and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-path-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align repository and deployment paths"
          git push origin HEAD:fix/repo-path-consistency
