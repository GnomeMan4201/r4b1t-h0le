name: PR Mobile Preview Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'dual-shell.js'
      - 'dual-shell.css'
      - 'r4b1t-h0l3-master.svg'
      - 'tests/locked-mobile-surface.test.js'
      - 'package.json'
      - '.github/workflows/pr-mobile-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build static preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='preview' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            ./ preview/
          printf '%s\n' "PR #${{ github.event.pull_request.number || 'manual' }} preview — commit $GITHUB_SHA" > preview/PREVIEW_BUILD.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4b1t-pr-${{ github.event.pull_request.number || 'manual' }}-mobile-preview
          path: preview/
          retention-days: 3
          if-no-files-found: error
