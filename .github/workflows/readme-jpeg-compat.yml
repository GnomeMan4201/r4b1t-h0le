name: README JPEG compatibility conversion

on:
  push:
    branches:
      - docs/readme-ios-image-compat
    paths:
      - .github/workflows/readme-jpeg-compat.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert README artwork to JPEG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("docs/readme")
          names = [
              "readme-hero",
              "readme-application-overview",
              "readme-core-mechanics",
              "readme-session-proofs",
              "readme-enter-the-hole",
          ]

          for name in names:
              src = root / f"{name}.webp"
              dst = root / f"{name}.jpg"
              with Image.open(src) as im:
                  im.convert("RGB").save(
                      dst,
                      "JPEG",
                      quality=88,
                      optimize=True,
                      progressive=False,
                  )

          readme = Path("README.md")
          text = readme.read_text()
          for name in names:
              text = text.replace(f"{name}.webp", f"{name}.jpg")
          readme.write_text(text)
          PY
      - name: Commit compatibility assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/readme/readme-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix(readme): use JPEG artwork for GitHub iOS"
          git push origin HEAD:docs/readme-ios-image-compat
