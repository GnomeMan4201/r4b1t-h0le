name: Proof Sessions v1 Audit

on:
  pull_request:
    paths:
      - 'proof-session.js'
      - 'proof-session-bundle.js'
      - 'tools/create-proof-session-bundle.js'
      - 'tools/inspect-proof-session-bundle.js'
      - 'proof-session-renderer.js'
      - 'proof-session-import.js'
      - 'proof-session-import.css'
      - 'proof-session.css'
      - 'docs/PROOF_SESSIONS_V1_SPEC.md'
      - 'docs/PROOF_SESSION_V0.1_SCHEMA.md'
      - 'docs/schema/proof-session-v0.1.schema.json'
      - 'tests/fixtures/proof-sessions-v1/**'
      - 'tests/proof-session-schema.test.js'
      - 'tests/proof-session-core.test.js'
      - 'tests/proof-session-bundle.test.js'
      - 'tests/proof-sessions-final-contract-audit.test.js'
      - 'docs/PROOF_SESSIONS_V1_AUDIT.md'
      - 'tests/proof-session-renderer.spec.js'
      - 'tests/proof-session-import.spec.js'
      - 'package.json'
      - '.github/workflows/proof-sessions-v1-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'proof-session.js'
      - 'proof-session-bundle.js'
      - 'tools/create-proof-session-bundle.js'
      - 'tools/inspect-proof-session-bundle.js'
      - 'proof-session-renderer.js'
      - 'proof-session-import.js'
      - 'proof-session-import.css'
      - 'proof-session.css'
      - 'docs/PROOF_SESSIONS_V1_SPEC.md'
      - 'docs/PROOF_SESSION_V0.1_SCHEMA.md'
      - 'docs/schema/proof-session-v0.1.schema.json'
      - 'tests/fixtures/proof-sessions-v1/**'
      - 'tests/proof-session-schema.test.js'
      - 'tests/proof-session-core.test.js'
      - 'tests/proof-session-bundle.test.js'
      - 'tests/proof-sessions-final-contract-audit.test.js'
      - 'docs/PROOF_SESSIONS_V1_AUDIT.md'
      - 'tests/proof-session-renderer.spec.js'
      - 'tests/proof-session-import.spec.js'
      - 'package.json'
      - '.github/workflows/proof-sessions-v1-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Proof Sessions module syntax
        run: node --check proof-session-renderer.js && node --check proof-session-import.js && node --check proof-session-bundle.js && node --check tools/create-proof-session-bundle.js && node --check tools/inspect-proof-session-bundle.js
      - name: Run Proof Sessions final contract audit suite
        run: node --test tests/proof-session-schema.test.js tests/proof-session-core.test.js tests/proof-session-bundle.test.js tests/proof-sessions-final-contract-audit.test.js
