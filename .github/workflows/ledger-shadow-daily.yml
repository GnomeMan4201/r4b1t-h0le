name: Daily Corpus Ledger Shadow
on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Explicit observation budget (100 normal, 2 pilot)
        type: choice
        default: '100'
        options: ['2', '100']
  push:
    branches: [main]
    paths:
      - 'corpus/ledger/consumers/schedule.py'
      - 'corpus/ledger/consumers/shadow-daily-v1.json'
      - 'corpus/ledger/tools/history.py'
      - '.github/workflows/ledger-shadow-daily.yml'
  pull_request:
    paths:
      - 'corpus/ledger/**'
      - 'tests/test_ledger_schedule.py'
      - '.github/workflows/ledger-shadow-daily.yml'
permissions:
  contents: read
jobs:
  consumer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-pool-sweep.txt
      - run: python3 -m unittest tests.test_ledger_schedule -v
  ordered-writer:
    needs: consumer-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: corpus-ledger-shadow-single-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-pool-sweep.txt
      - name: Restore verified published history or pinned genesis
        run: |
          set -euo pipefail
          branch=automation/corpus-ledger-shadow
          previous=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          echo "SHADOW_PREVIOUS_SHA=$previous" >> "$GITHUB_ENV"
          mkdir -p /tmp/shadow-previous
          if [ -n "$previous" ]; then
            git fetch origin "$previous"
            git archive "$previous" corpus/ledger/shadow/history | tar -x -C /tmp/shadow-previous
          else
            git fetch origin 340139e719d2f6afbc7bfa5b83b5826626f45d99
            mkdir -p /tmp/shadow-genesis-authority
            git archive 340139e719d2f6afbc7bfa5b83b5826626f45d99 corpus/runtime corpus/releases corpus/terrains urls.txt | tar -x -C /tmp/shadow-genesis-authority
            python3 -m corpus.ledger.tools.history initialize --authority-root /tmp/shadow-genesis-authority --out /tmp/shadow-previous/corpus/ledger/shadow/history
          fi
          python3 -m corpus.ledger.tools.history verify --history /tmp/shadow-previous/corpus/ledger/shadow/history
      - name: Stage one date-bound observation window
        id: stage
        env:
          SHADOW_EVENT: ${{ github.event_name }}
          SHADOW_REQUESTED_BUDGET: ${{ inputs.budget || '100' }}
        run: |
          set -euo pipefail
          budget="$SHADOW_REQUESTED_BUDGET"
          if [ "$SHADOW_EVENT" = push ]; then budget=2; fi
          day=$(date -u +%F)
          echo "SHADOW_RUN_DAY=$day" >> "$GITHUB_ENV"
          python3 -m corpus.ledger.tools.history run --history /tmp/shadow-previous/corpus/ledger/shadow/history --day "$day" --budget "$budget" --out /tmp/shadow-next/corpus/ledger/shadow/history > /tmp/shadow-result.json
          cat /tmp/shadow-result.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('status='+json.load(open('/tmp/shadow-result.json'))['status'])
          PY
      - name: Verify staged history independently
        if: steps.stage.outputs.status == 'STAGED_SHADOW_RUN'
        run: python3 -m corpus.ledger.tools.history verify --history /tmp/shadow-next/corpus/ledger/shadow/history
      - name: Preserve diagnostic evidence
        if: steps.stage.outputs.status == 'STAGED_SHADOW_RUN'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-shadow-history-${{ github.run_id }}
          path: /tmp/shadow-next/corpus/ledger/shadow/history
          if-no-files-found: error
      - name: Fast-forward publish to isolated evidence branch
        if: steps.stage.outputs.status == 'STAGED_SHADOW_RUN'
        run: |
          set -euo pipefail
          base="$SHADOW_PREVIOUS_SHA"
          if [ -z "$base" ]; then base="$GITHUB_SHA"; fi
          git worktree add --detach /tmp/shadow-publisher "$base"
          mkdir -p /tmp/shadow-publisher/corpus/ledger/shadow/history
          cp -a /tmp/shadow-next/corpus/ledger/shadow/history/. /tmp/shadow-publisher/corpus/ledger/shadow/history/
          cd /tmp/shadow-publisher
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- corpus/ledger/shadow/history
          git commit -m "Publish shadow HEAD window $SHADOW_RUN_DAY"
          git push origin HEAD:refs/heads/automation/corpus-ledger-shadow
          echo "Published shadow commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
