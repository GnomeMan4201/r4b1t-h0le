name: Mobile WebKit REEL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-webkit-reel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact release head SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked Node dependencies
        run: npm ci

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit

      - name: Stage site under /r4b1t-h0le/ path
        run: |
          mkdir -p test-site/r4b1t-h0le
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t-h0le/

      - name: Verify iPhone WebKit REEL, rabbit, and result authority
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t-h0le/
          CI: 'true'
        run: npx playwright test --config=playwright.reel-webkit.config.js

      - name: Upload WebKit report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-webkit-reel-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
