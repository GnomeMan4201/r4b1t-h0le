name = "r4b1t-proxy"
main = "worker/src/index.mjs"
compatibility_date = "2026-09-18"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://gnomeman4201.github.io"
REQUIRE_RATE_LIMIT = "true"
MAX_PROXY_BYTES = "5242880"
MAX_OG_BYTES = "1048576"
MAX_REDIRECTS = "4"
UPSTREAM_TIMEOUT_MS = "8000"

[[ratelimits]]
name = "R4B1T_RATE_LIMITER"
namespace_id = "4201"

[ratelimits.simple]
limit = 60
period = 60
